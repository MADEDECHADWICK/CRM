name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed before setup-node so its cache can key on the
      # pnpm lockfile. Version matches packageManager in package.json.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Prisma client is generated (not committed), so the API cannot
      # typecheck or run without it.
      - name: Generate Prisma client
        # prisma.config.ts validates DATABASE_URL when loaded. Client generation
        # does not connect, so CI only needs a well-formed placeholder URL.
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/crm_ci
        run: pnpm --filter api exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm --filter api test
