name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed before setup-node so its cache can key on the
      # pnpm lockfile. Version matches packageManager in package.json.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Prisma client is generated (not committed), so the API cannot
      # typecheck or run without it.
      - name: Generate Prisma client
        # prisma.config.ts validates DATABASE_URL when loaded. Client generation
        # does not connect, so CI only needs a well-formed placeholder URL.
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/crm_ci
        run: pnpm --filter api exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm --filter api test

      - name: Build web application
        run: pnpm --filter web build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Disposable CI database: never use production credentials for workflow tests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/crm_ci
      RUN_DB_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api exec prisma migrate deploy
      - name: Verify CRM workflows against disposable Postgres
        run: pnpm --filter api test

  deploy:
    needs: [build, integration]
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /srv/crm
          mkdir -p /srv/crm-backups
          docker compose exec -T db pg_dump -U crm_user -d crm -Fc > "/srv/crm-backups/pre-deploy-$(date +%F-%H%M%S).dump"
          git pull --ff-only
          docker compose build api web
          docker compose up -d
          docker compose ps
          REMOTE

      - name: Verify public endpoint
        run: |
          curl -fsS --retry 10 --retry-delay 6 https://ronalds-global.com/api/
